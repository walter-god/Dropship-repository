version: '3.9'

# Environment shared by every service running the backend image (web, worker,
# beat). Anchored so the three can never drift out of sync.
x-backend-env: &backend-env
  SECRET_KEY: dev-secret-key-change-in-production
  DEBUG: "True"
  DB_NAME: udom_estore
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: db
  DB_PORT: "5432"
  ALLOWED_HOSTS: localhost,127.0.0.1,backend,udom_backend
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  # Must match the container_name values below — the deployer looks itself up
  # by name to join per-app networks.
  DEPLOYER_ATTACH_CONTAINERS: udom_backend,udom_celery_worker
  DEPLOYER_DB_CONTAINER_NAME: udom_db
  DEPLOYER_APP_DB_INTERNAL_HOST: db

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

services:
  db:
    image: postgres:15-alpine
    container_name: udom_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: udom_estore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - udom_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: udom_redis
    restart: unless-stopped
    networks:
      - udom_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: *backend-build
    image: udom-backend:local
    container_name: udom_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
      # Lets Django orchestrate student containers. The socket is root-owned,
      # so this container deliberately stays root.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - udom_internal
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  celery_worker:
    build: *backend-build
    image: udom-backend:local
    container_name: udom_celery_worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
      # Builds read uploaded source zips straight off the media volume.
      - media_files:/app/media
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - udom_internal
    command: celery -A udom_backend worker --loglevel=info --concurrency=2

  celery_beat:
    build: *backend-build
    image: udom-backend:local
    container_name: udom_celery_beat
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - media_files:/app/media
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - udom_internal
    command: celery -A udom_backend beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: udom_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    networks:
      - udom_internal
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: udom_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_files:/app/staticfiles
      - media_files:/app/media
    networks:
      - udom_internal
    depends_on:
      - backend
      - frontend

networks:
  # Platform services only. Per-app networks (udom_app_<slug>) are created at
  # deploy time by the deployer and must NOT be declared here — compose would
  # otherwise tear them down and orphan running student containers.
  udom_internal:
    name: udom_internal
    driver: bridge

volumes:
  postgres_data:
  media_files:
  static_files:
